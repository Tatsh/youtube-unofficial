jobs:
  spelling:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Check spelling'
        uses: 'streetsidesoftware/cspell-action@e0668cf020899e887ee8ad4d173c31738a79eae8'
        with:
          check_dot_files: true
          suggestions: true
name: 'Spelling'
'on':
  pull_request:
    branches:
      - 'master'
  push:
    branches:
      - 'master'
permissions:
  contents: 'read'
