jobs:
  build:
    permissions:
      attestations: 'write'
      contents: 'read'
      id-token: 'write'
    runs-on: ${{ matrix.system.image }}
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Install yq'
        run: 'pipx install yq'
      - name: 'Install uv'
        uses: 'astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7'
        with:
          enable-cache: false
      - name: 'Set up Python'
        uses: 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97'
        with:
          python-version: '3.13'
      - name: 'Install dependencies (uv)'
        run: |
          uv sync
          uv pip install python-appimage
          wget -O generic.svg 'https://raw.githubusercontent.com/KDE/breeze-icons/refs/heads/master/icons/preferences/32/preferences-other.svg'
        shell: 'bash'
      - name: 'Build with python-appimage'
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          project_name=$(tomlq -r '.project.urls.repository|split("/")[-1]' pyproject.toml)
          version=$(tomlq -r .project.version pyproject.toml)
          rm -fR dist
          mkdir dist
          base_image_tag='manylinux2014_${{ matrix.system.arch }}.AppImage'
          base_image=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/niess/python-appimage/releases/tags/python3.13" |
              jq -r --arg suffix "${base_image_tag}" \
                  'first(.assets[] | select(.name | endswith($suffix)) | .browser_download_url)')
          if [[ -z "${base_image}" || "${base_image}" == 'null' ]]; then
              echo "No python3.13 base image ending in ${base_image_tag}." >&2
              exit 1
          fi
          curl -fsSL -O "${base_image}"
          base_image="${base_image##*/}"
          chmod +x "${base_image}"
          echo "Using base image ${base_image}."
          while IFS=$' ' read -r script_name python_path func_name; do
              func_name="${func_name#"${func_name%%[![:space:]]*}"}"
              func_name="${func_name%"${func_name##*[![:space:]]}"}"
              rm -fR recipe
              mkdir recipe
              cat > recipe/entrypoint.sh <<EOF
          {{ python-executable }} \${APPDIR}/opt/python{{ python-version }}/bin/${script_name} "\$@"
          EOF
              chmod +x recipe/entrypoint.sh
              if [[ "${ACTIONS_RUNNER_DEBUG}" == 'true' ]]; then
                  cat recipe/entrypoint.sh
              fi
              cat > "recipe/${script_name}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=${script_name}
          Icon=${script_name}
          Categories=Utility;
          Terminal=true
          X-AppImage-Version=${version}
          EOF
              if [[ "${ACTIONS_RUNNER_DEBUG}" == 'true' ]]; then
                  cat "recipe/${script_name}.desktop"
              fi
              cat > recipe/requirements.txt <<EOF
          $(pwd -P)
          EOF
              if [[ "${ACTIONS_RUNNER_DEBUG}" == 'true' ]]; then
                  cat recipe/requirements.txt
              fi
              cat > "recipe/${script_name}.appinfo.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>${script_name}</id>
            <metadata_license>GFDL-1.3</metadata_license>
            <project_license>MIT</project_license>
            <name>${script_name}</name>
            <summary>${script_name} from ${project_name}</summary>
            <description>
              <p>${script_name} from ${project_name}. - ${{ github.server_url }}/${{ github.repository }}</p>
            </description>
            <launchable type="desktop-id">${script_name}.desktop</launchable>
            <url type="homepage">${{ github.server_url }}/${{ github.repository }}</url>
            <screenshots>
              <screenshot type="default">
                <image></image>
              </screenshot>
            </screenshots>
            <provides>
              <id>${script_name}.desktop</id>
            </provides>
          </component>
          EOF
              if [[ "${ACTIONS_RUNNER_DEBUG}" == 'true' ]]; then
                  cat "recipe/${script_name}.appinfo.xml"
              fi
              cp generic.svg "recipe/${script_name}.svg"
              echo "Building AppImage for '${script_name}'..."
              uv run python -m python_appimage -v build app -b "${base_image}" recipe
              mv "${script_name}-${{ matrix.system.arch }}.AppImage" "dist/${script_name}-v${version}-${{ matrix.system.arch }}.AppImage"
          done < <(tomlq -r '.project.scripts|to_entries[]|"\(.key) \(.value|split(":")|join(" "))"' pyproject.toml)
        shell: 'bash'
      - name: 'Test binary'
        run: |
          dist_files=(dist/*)
          echo "Found ${#dist_files[@]} files in dist/: ${dist_files[*]##*/}"
          for file in "${dist_files[@]}"; do
              if [[ "${file}" == dist/index.*js ]]; then
                  echo "Skipping index.js."
                  continue
              fi
              echo "Testing '${file}'."
              "./${file}" --help
          done
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: youtube-unofficial-binaries-linux-${{ matrix.system.arch }}
          path: |
            dist/*
      - name: 'Generate SBOM'
        uses: 'anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c'
        env:
          SYFT_SOURCE_NAME: 'youtube-unofficial'
          SYFT_SOURCE_VERSION: ${{ github.ref_name }}
        with:
          path: 'dist/'
          output-file: 'sbom.spdx.json'
          upload-artifact: false
      - name: 'Attest'
        uses: 'actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6'
        with:
          subject-path: 'dist/*.AppImage'
      - name: 'Attest SBOM'
        uses: 'actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6'
        with:
          subject-path: 'dist/*.AppImage'
          sbom-path: 'sbom.spdx.json'
    strategy:
      matrix:
        system:
          - { arch: aarch64, image: ubuntu-24.04-arm }
          - { arch: x86_64, image: ubuntu-latest }
  release-assets:
    concurrency:
      group: release-assets-${{ github.ref }}
      queue: max
    if: github.ref_type == 'tag'
    needs:
      - 'build'
    permissions:
      contents: 'write'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Download build artifacts'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c'
        with:
          merge-multiple: true
          path: '_release_assets'
          pattern: youtube-unofficial-binaries-linux-*
      - name: 'Create or update draft release'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: 'bash'
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --notes ''
          shopt -s nullglob
          assets=(_release_assets/*)
          if [ -z "${assets[0]-}" ]; then
            echo 'No build artifacts to attach.'
            exit 0
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
name: 'AppImage'
'on':
  push:
    branches:
      - 'master'
    paths:
      - 'youtube_unofficial/**'
      - '.github/workflows/appimage.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'poetry.lock'
    tags:
      - 'v*.*.*'
permissions: {}
